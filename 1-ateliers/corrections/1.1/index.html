<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue via CDN</title>
  </head>
  <body>
    <h1>Vue avec le CDN</h1>
    <div id="app">
      <p>Question : {{ question }}</p>
      <p>Réponse : {{ response }}</p>
    </div>
    <script type="module">
      import {
        createApp,
        ref,
      } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
      createApp({
        setup() {
          const question = ref("Que vaut typeof null ?");
          const response = ref("object");
          return {
            question,
            response,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
